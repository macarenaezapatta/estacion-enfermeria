function edadEnMeses(edad, unidad) {
  if (edad === undefined || edad === null || edad === "") return null;
  const n = +edad;
  if (isNaN(n)) return null;
  if (unidad === "Días") return n / 30;
  if (unidad === "Meses") return n;
  return n * 12; // "Años" o sin especificar
}

const FRANJAS_ETARIAS = [
  { id: "neonato", label: "neonato (0-28 días)", maxMeses: 1, fc: [100, 180], fr: [30, 60], tas: [60, 90] },
  { id: "lactante", label: "lactante (1-11 meses)", maxMeses: 12, fc: [100, 170], fr: [24, 38], tas: [70, 100] },
  { id: "preescolar1", label: "niño/a de 1-2 años", maxMeses: 36, fc: [98, 140], fr: [22, 30], tas: [80, 110] },
  { id: "preescolar2", label: "niño/a de 3-4 años", maxMeses: 60, fc: [80, 120], fr: [20, 28], tas: [80, 115] },
  { id: "escolar", label: "niño/a de 5-11 años", maxMeses: 144, fc: [70, 110], fr: [18, 24], tas: [85, 120] },
  { id: "adolescente", label: "adolescente de 12-17 años", maxMeses: 216, fc: [60, 100], fr: [12, 22], tas: [95, 130] },
  { id: "adulto", label: "adulto", maxMeses: Infinity, fc: [60, 100], fr: [12, 20], tas: [90, 140] },
];

function franjaEtaria(edadMeses) {
  if (edadMeses === null) return FRANJAS_ETARIAS[FRANJAS_ETARIAS.length - 1];
  return FRANJAS_ETARIAS.find((f) => edadMeses <= f.maxMeses) || FRANJAS_ETARIAS[FRANJAS_ETARIAS.length - 1];
}

/* ============================================================
   UTILIDADES CLÍNICAS
============================================================ */
function interpretaTA(s, d, edadMeses) {
  if (!s || !d) return null;
  s = +s; d = +d;
  const franja = franjaEtaria(edadMeses);
  const [tasMin, tasMax] = franja.tas;
  if (s < tasMin) return { texto: `hipotensión arterial para ${franja.label}`, alerta: true };
  if (s > tasMax || d >= 90) return { texto: `hipertensión arterial para ${franja.label}`, alerta: true };
  return { texto: "tensión arterial dentro de parámetros esperados para la edad", alerta: false };
}
function interpretaFC(fc, edadMeses) {
  if (!fc) return null;
  fc = +fc;
  const franja = franjaEtaria(edadMeses);
  const [min, max] = franja.fc;
  if (fc > max) return { texto: `taquicardia para ${franja.label}`, alerta: true };
  if (fc < min) return { texto: `bradicardia para ${franja.label}`, alerta: true };
  return { texto: "frecuencia cardíaca dentro de parámetros esperados para la edad", alerta: false };
}
function interpretaFR(fr, edadMeses) {
  if (!fr) return null;
  fr = +fr;
  const franja = franjaEtaria(edadMeses);
  const [min, max] = franja.fr;
  if (fr > max) return { texto: `taquipnea para ${franja.label}`, alerta: true };
  if (fr < min) return { texto: `bradipnea para ${franja.label}`, alerta: true };
  return { texto: "frecuencia respiratoria dentro de parámetros esperados para la edad", alerta: false };
}
function interpretaTemp(t) {
  if (!t) return null;
  t = +t;
  if (t >= 39) return { texto: "hipertermia", alerta: true };
  if (t >= 37.6) return { texto: "febrícula", alerta: true };
  if (t < 36) return { texto: "hipotermia", alerta: true };
  return { texto: "afebril", alerta: false };
}
function interpretaSat(s) {
  if (!s) return null;
  s = +s;
  if (s < 90) return { texto: "hipoxemia severa", alerta: true };
  if (s < 95) return { texto: "hipoxemia leve a moderada", alerta: true };
  return { texto: "saturación de oxígeno adecuada", alerta: false };
}
function totalGlasgow(g) {
  const o = +g.ocular || 0, v = +g.verbal || 0, m = +g.motora || 0;
  const total = o + v + m;
  return total > 0 ? total : null;
}
function interpretaGlasgow(total) {
  if (total === null) return null;
  if (total >= 15) return "lúcido, orientado en tiempo y espacio, con Glasgow 15/15";

}

/* ============================================================
   APLICACIÓN PRINCIPAL
============================================================ */
export default function App() {
  const [session, setSession] = useState(null);
  const [firmado, setFirmado] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [nombreFirmante, setNombreFirmante] = useState('');
  const [aceptoTerminos, setAceptoTerminos] = useState(false);
  const [loading, setLoading] = useState(false);

  // Estados del Formulario Clínico
  const [filiacion, setFiliacion] = useState({
    nombre: "", edad: "", unidadEdad: "Años", sexo: SEXO_OPCIONES[0], domicilio: "", ciudadResidencia: CIUDAD_RESIDENCIA_OPCIONES[1], motivo: "", ayuno: "", tiempoQx: "", acompanante: ACOMPANANTE_OPCIONES[0], acompananteDetalle: "", tabaco: "Niega", alcohol: "Niega", estudios: ""
  });
  const [vitals, setVitals] = useState({ tas: "", tad: "", fc: "", fr: "", temp: "", sat: "", dolor: "0" });
  const [glasgow, setGlasgow] = useState({ ocular: "4", verbal: "5", motora: "6" });
  const [examen, setExamen] = useState({
    pupilas: "Isocóricas normorreactivas", mucosas: "Rosadas y húmedas", carotideo: "Simétrico y de buena amplitud", mecanica: "Eupneico, sin tiraje", auscultacion: "Murmullo vesicular conservado bilateral", rha: "Presentes y normoactivos", palpacion: "Blando, depresible e indoloro", giordano: "Negativo bilateral", pulsos: "Presentes y simétricos", llenado: "Menor a 2 segundos", edema: "Sin edema", fuerza: "Conservada 5/5 en las cuatro extremidades", riesgoLPP: "Bajo riesgo", viasPerif: "", sondas: "", drenajes: ""
  });
  const [fisiologicos, setFisiologicos] = useState({ diuresis: "Presente, espontánea", catarsis: "Presente, conservada" });
  const [meds, setMeds] = useState([]);
  const [selectedMed, setSelectedMed] = useState("");
  const [indicacionesExtra, setIndicacionesExtra] = useState("");

  const [searchVademecum, setSearchVademecum] = useState("");
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
    });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
    });
    return () => subscription.unsubscribe();
  }, []);

  const handleLogin = async (e) => {
    e.preventDefault();
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) alert('Error de autenticación: ' + error.message);
    setLoading(false);
  };

  const handleLogout = async () => {
    await supabaseClient.auth.signOut();
    setFirmado(false);
  };

  const handleFirma = async (e) => {
    e.preventDefault();
    if (!aceptoTerminos) {
      alert("Debe confirmar la aceptación de los términos de protección de datos.");
      return;
    }
    setLoading(true);
    const { error } = await supabaseClient.from('firmas_compromiso').insert([{
      user_id: session.user.id,
      nombre_firmante: nombreFirmante,
      fecha_firma: new Date().toISOString()
    }]);

    if (error) {
      alert('Error al registrar firma en la base de datos: ' + error.message);
    } else {
      setFirmado(true);
    }
    setLoading(false);
  };

  // Interpretaciones automáticas
  const edadMesesVal = useMemo(() => edadEnMeses(filiacion.edad, filiacion.unidadEdad), [filiacion.edad, filiacion.unidadEdad]);
  const intTA = useMemo(() => interpretaTA(vitals.tas, vitals.tad, edadMesesVal), [vitals.tas, vitals.tad, edadMesesVal]);
  const intFC = useMemo(() => interpretaFC(vitals.fc, edadMesesVal), [vitals.fc, edadMesesVal]);
  const intFR = useMemo(() => interpretaFR(vitals.fr, edadMesesVal), [vitals.fr, edadMesesVal]);
  const intTemp = useMemo(() => interpretaTemp(vitals.temp), [vitals.temp]);
  const intSat = useMemo(() => interpretaSat(vitals.sat), [vitals.sat]);
  const glasgowTot = useMemo(() => totalGlasgow(glasgow), [glasgow]);
  const intGlas = useMemo(() => interpretaGlasgow(glasgowTot), [glasgowTot]);

  const addMed = () => {
    if (!selectedMed) return;
    const m = VADEMECUM.find((x) => x.id === +selectedMed);
    if (!m) return;
    if (meds.some((x) => x.id === m.id)) return;
    setMeds([...meds, { ...m, viaElegida: m.vias[0], indicacion: m.dosis }]);
    setSelectedMed("");
  };

  const removeMed = (id) => {
    setMeds(meds.filter((m) => m.id !== id));
  };

  // Construcción de la Narrativa de Enfermería
  const narrativa = useMemo(() => {
    let p = [];
    const nom = filiacion.nombre || "Paciente";
    const ed = filiacion.edad ? `${filiacion.edad} ${filiacion.unidadEdad}` : "edad no consignada";
    const sx = filiacion.sexo ? filiacion.sexo.toLowerCase() : "";
    const dom = filiacion.domicilio ? `, con domicilio en ${filiacion.domicilio}` : "";
    const ciu = filiacion.ciudadResidencia ? ` (${filiacion.ciudadResidencia})` : "";
    const mot = filiacion.motivo ? `, que ingresa por ${filiacion.motivo}` : "";
    const ay = filiacion.ayuno ? `. Refiere ${filiacion.ayuno} horas de ayuno` : "";
    const tqx = filiacion.tiempoQx ? ` y ${filiacion.tiempoQx} de evolución quirúrgica` : "";
    const ac = filiacion.acompanante ? `. Permanece acompañado/a por ${filiacion.acompanante.toLowerCase()}${filiacion.acompananteDetalle ? ` (${filiacion.acompananteDetalle})` : ""}` : "";
    const tab = filiacion.tabaco === "Refiere" ? " Refiere consumo de tabaco." : "";
    const alc = filiacion.alcohol === "Refiere" ? " Refiere consumo de alcohol." : "";
    const est = filiacion.estudios ? `. Estudios complementarios aportados: ${filiacion.estudios}` : "";

    p.push(`Se ingresa/valora a ${nom}, de ${ed} de edad, sexo ${sx}${dom}${ciu}${mot}${ay}${tqx}${ac}.${tab}${alc}${est}.`);

    let sv = [];
    if (vitals.tas && vitals.tad) sv.push(`tensión arterial de ${vitals.tas}/${vitals.tad} mmHg (${intTA?.texto || ""})`);
    if (vitals.fc) sv.push(`frecuencia cardíaca de ${vitals.fc} bpm (${intFC?.texto || ""})`);
    if (vitals.fr) sv.push(`frecuencia respiratoria de ${vitals.fr} rpm (${intFR?.texto || ""})`);
    if (vitals.temp) sv.push(`temperatura axilar de ${vitals.temp} °C (${intTemp?.texto || ""})`);
    if (vitals.sat) sv.push(`saturación de O2 al ${vitals.sat}% (${intSat?.texto || ""})`);
    if (vitals.dolor) sv.push(`escala de dolor EVA ${vitals.dolor}/10`);

    p.push(`Al control de signos vitales presenta: ${sv.join(", ")}.`);

    if (intGlas) {
      p.push(`A la valoración neurológica se encuentra ${intGlas}. Pupilas ${examen.pupilas.toLowerCase()}.`);
    }

    p.push(`Al examen físico segmentario: Mucosas ${examen.mucosas.toLowerCase()}, pulso carotídeo ${examen.carotideo.toLowerCase()}. En esfera cardiopulmonar, mecánica respiratoria ${examen.mecanica.toLowerCase()} y auscultación con ${examen.auscultacion.toLowerCase()}. Abdomen con ruidos hidroaéreos ${examen.rha.toLowerCase()}, a la palpación ${examen.palpacion.toLowerCase()}, signo de Giordano ${examen.giordano.toLowerCase()}. En extremidades, pulsos periféricos ${examen.pulsos.toLowerCase()}, llenado capilar ${examen.llenado.toLowerCase()}, ${examen.edema.toLowerCase()} y fuerza muscular ${examen.fuerza.toLowerCase()}.`);

    let disp = [];
    if (examen.viasPerif) disp.push(`vía periférica: ${examen.viasPerif}`);
    if (examen.sondas) disp.push(`sondas: ${examen.sondas}`);
    if (examen.drenajes) disp.push(`drenajes: ${examen.drenajes}`);
    disp.push(`valoración de riesgo LPP: ${examen.riesgoLPP}`);

    p.push(`Respecto a dispositivos y piel: ${disp.join("; ")}. Patrón de eliminación: diuresis ${fisiologicos.diuresis.toLowerCase()} y catarsis ${fisiologicos.catarsis.toLowerCase()}.`);

    if (meds.length > 0) {
      const listaMeds = meds.map((m) => `${m.nombre} (${m.viaElegida}, ${m.indicacion})`).join("; ");
      p.push(`Plan farmacológico en curso: ${listaMeds}.`);
    }

    if (indicacionesExtra) {
      p.push(`Indicaciones y observaciones complementarias: ${indicacionesExtra}`);
    }

    return p.join("\n\n");
  }, [filiacion, vitals, glasgow, examen, fisiologicos, meds, indicacionesExtra, intTA, intFC, intFR, intTemp, intSat, intGlas]);

  const handleCopy = () => {
    navigator.clipboard.writeText(narrativa);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleGuardarSupabase = async () => {
    setLoading(true);
    const registro = {
      user_id: session.user.id,
      paciente: filiacion.nombre || "Sin Nombre",
      edad: `${filiacion.edad} ${filiacion.unidadEdad}`,
      fc: vitals.fc,
      ta: `${vitals.tas}/${vitals.tad}`,
      temperatura: vitals.temp,
      saturacion: vitals.sat,
      glasgow: glasgowTot,
      observaciones: narrativa,
      fecha: new Date().toISOString()
    };

    const { error } = await supabaseClient.from('valoraciones').insert([registro]);

    if (error) {
      alert('Error al guardar la valoración en Supabase: ' + error.message);
    } else {
      alert('¡Valoración clínica registrada con éxito en la base de datos!');
    }
    setLoading(false);
  };

  const vademecumFiltrado = useMemo(() => {
    if (!searchVademecum) return VADEMECUM;
    const q = searchVademecum.toLowerCase();
    return VADEMECUM.filter(
      (m) =>
        m.nombre.toLowerCase().includes(q) ||
        m.comercial.toLowerCase().includes(q) ||
        m.familia.toLowerCase().includes(q)
    );
  }, [searchVademecum]);

  // PANTALLA 1: LOGIN
  if (!session) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F3F6F6] p-4">
        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-[#DCE7E6]">
          <div className="text-center mb-6">
            <Stethoscope className="w-12 h-12 text-[#0B6E6E] mx-auto mb-2" />
            <h1 className="text-2xl font-bold text-[#1E3547]">Estación de Valoración</h1>
            <p className="text-xs text-gray-500 mt-1">Acceso institucional a la plataforma clínica</p>
          </div>
          <form onSubmit={handleLogin} className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-[#1E3547] mb-1">Correo institucional</label>
              <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-2.5 text-sm border border-[#DCE7E6] rounded-md outline-none focus:ring-2 focus:ring-[#0B6E6E]" placeholder="estudiante@institucion.edu.ar" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-[#1E3547] mb-1">Contraseña</label>
              <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-2.5 text-sm border border-[#DCE7E6] rounded-md outline-none focus:ring-2 focus:ring-[#0B6E6E]" placeholder="••••••••" />
            </div>
            <button type="submit" disabled={loading} className="w-full bg-[#0B6E6E] hover:bg-[#075252] text-white py-3 rounded-md font-bold text-sm transition-colors shadow">
              {loading ? 'Validando...' : 'Ingresar al Sistema'}
            </button>
          </form>
        </div>
      </div>
    );
  }

  // PANTALLA 2: FIRMA / HABEAS DATA
  if (!firmado) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F3F6F6] p-4">
        <div className="bg-white p-8 rounded-xl shadow-lg max-w-lg w-full border border-[#DCE7E6]">
          <div className="flex items-center space-x-3 mb-4 text-[#0B6E6E]">
            <ShieldCheck className="w-8 h-8" />
            <h2 className="text-xl font-bold text-[#1E3547]">Protección de Datos & Consentimiento</h2>
          </div>
          <p className="text-xs text-gray-600 mb-6 leading-relaxed">
            Declaro bajo juramento académico que la información registrada durante las valoraciones de enfermería se apega a las normativas vigentes de confidencialidad y Habeas Data para el manejo seguro de datos clínicos.
          </p>
          <form onSubmit={handleFirma} className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-[#1E3547] mb-1">Nombre, Apellido y Legajo/DNI del Responsable</label>
              <input type="text" required value={nombreFirmante} onChange={(e) => setNombreFirmante(e.target.value)} className="w-full p-2.5 text-sm border border-[#DCE7E6] rounded-md outline-none focus:ring-2 focus:ring-[#0B6E6E]" placeholder="Ej: Macarena Zapatta - Legajo 12345" />
            </div>
            <div className="flex items-center space-x-2">
              <input type="checkbox" id="checkFirma" checked={aceptoTerminos} onChange={(e) => setAceptoTerminos(e.target.checked)} className="w-4 h-4 text-[#0B6E6E]" />
              <label htmlFor="checkFirma" className="text-xs text-gray-700">Acepto la declaración de confidencialidad y registro digital.</label>
            </div>
            <button type="submit" disabled={loading} className="w-full bg-[#0B6E6E] hover:bg-[#075252] text-white py-3 rounded-md font-bold text-sm transition-colors shadow">
              {loading ? 'Registrando firma...' : 'Firmar y Acceder a la Estación'}
            </button>
          </form>
        </div>
      </div>
    );
  }

  // PANTALLA 3: ESTACIÓN COMPLETA DE VALORACIÓN
  return (
    <div className="min-h-screen bg-[#F3F6F6] text-[#1E3547] pb-12">
      {/* Top Header */}
      <header className="bg-white border-b border-[#DCE7E6] sticky top-0 z-30 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
          <div className="flex items-center space-x-3">
            <div className="bg-[#0B6E6E] text-white p-2 rounded-lg">
              <Stethoscope className="w-6 h-6" />
            </div>
            <div>
              <h1 className="font-bold text-lg leading-tight text-[#1E3547]">Estación de Valoración de Enfermería</h1>
              <p className="text-xs text-gray-500">Plataforma Académica de Registro Clínico</p>
            </div>
          </div>
          <button onClick={handleLogout} className="flex items-center space-x-1.5 bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-md text-xs font-semibold transition-colors">
            <LogOut className="w-4 h-4" />
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </header>

      {/* Main Container */}
      <main className="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Left Column: Form Section */}
        <div className="lg:col-span-7 space-y-6">
          
          {/* Filiación */}
          <section className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm">
            <h2 className="font-bold text-base text-[#1E3547] mb-4 flex items-center space-x-2 border-b border-gray-100 pb-2">
              <ClipboardList className="w-5 h-5 text-[#0B6E6E]" />
              <span>1. Filiación y Datos de Ingreso</span>
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              {FILIACION_FIELDS.map((f) => (
                <div key={f.key} className={f.type === "textarea" ? "md:col-span-2" : ""}>
                  <label className="block font-semibold text-gray-700 mb-1">{f.label}</label>
                  {f.type === "select" ? (
                    <select value={filiacion[f.key]} onChange={(e) => setFiliacion({ ...filiacion, [f.key]: e.target.value })} className="w-full p-2 border border-[#DCE7E6] rounded-md outline-none focus:ring-1 focus:ring-[#0B6E6E]">
                      {f.options.map((o) => (
                        <option key={o} value={o}>{o}</option>
                      ))}
                    </select>
                  ) : f.type === "textarea" ? (
                    <textarea rows={2} value={filiacion[f.key]} onChange={(e) => setFiliacion({ ...filiacion, [f.key]: e.target.value })} placeholder={f.placeholder} className="w-full p-2 border border-[#DCE7E6] rounded-md outline-none focus:ring-1 focus:ring-[#0B6E6E]" />
                  ) : (
                    <input type={f.type} value={filiacion[f.key]} onChange={(e) => setFiliacion({ ...filiacion, [f.key]: e.target.value })} placeholder={f.placeholder} className="w-full p-2 border border-[#DCE7E6] rounded-md outline-none focus:ring-1 focus:ring-[#0B6E6E]" />
                  )}
                </div>
              ))}
            </div>
          </section>

          {/* Signos Vitales y Glasgow */}
          <section className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm">
            <h2 className="font-bold text-base text-[#1E3547] mb-4 flex items-center space-x-2 border-b border-gray-100 pb-2">
              <Activity className="w-5 h-5 text-[#0B6E6E]" />
              <span>2. Signos Vitales y Escala de Glasgow</span>
            </h2>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs mb-4">
              <div>
                <label className="block font-semibold text-gray-700 mb-1">TAS (mmHg)</label>
                <input type="number" value={vitals.tas} onChange={(e) => setVitals({ ...vitals, tas: e.target.value })} placeholder="120" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
              <div>
                <label className="block font-semibold text-gray-700 mb-1">TAD (mmHg)</label>
                <input type="number" value={vitals.tad} onChange={(e) => setVitals({ ...vitals, tad: e.target.value })} placeholder="80" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
              <div>
                <label className="block font-semibold text-gray-700 mb-1">FC (bpm)</label>
                <input type="number" value={vitals.fc} onChange={(e) => setVitals({ ...vitals, fc: e.target.value })} placeholder="75" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
              <div>
                <label className="block font-semibold text-gray-700 mb-1">FR (rpm)</label>
                <input type="number" value={vitals.fr} onChange={(e) => setVitals({ ...vitals, fr: e.target.value })} placeholder="16" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
              <div>
                <label className="block font-semibold text-gray-700 mb-1">Temp (°C)</label>
                <input type="number" step="0.1" value={vitals.temp} onChange={(e) => setVitals({ ...vitals, temp: e.target.value })} placeholder="36.5" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
              <div>
                <label className="block font-semibold text-gray-700 mb-1">SatO2 (%)</label>
                <input type="number" value={vitals.sat} onChange={(e) => setVitals({ ...vitals, sat: e.target.value })} placeholder="98" className="w-full p-2 border border-[#DCE7E6] rounded-md" />
              </div>
            </div>

            {/* Escala de Glasgow */}
            <div className="bg-gray-50 p-3 rounded-lg border border-gray-200 text-xs mb-4">
              <span className="font-bold text-[#1E3547] block mb-2">Escala de Glasgow:</span>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                <div>
                  <label className="block text-gray-600 mb-0.5">Respuesta Ocular</label>
                  <select value={glasgow.ocular} onChange={(e) => setGlasgow({ ...glasgow, ocular: e.target.value })} className="w-full p-1.5 border rounded">
                    <option value="4">4 - Espontánea</option>
                    <option value="3">3 - Al orden verbal</option>
                    <option value="2">2 - Al dolor</option>
                    <option value="1">1 - Ausente</option>
                  </select>
                </div>
                <div>
                  <label className="block text-gray-600 mb-0.5">Respuesta Verbal</label>
                  <select value={glasgow.verbal} onChange={(e) => setGlasgow({ ...glasgow, verbal: e.target.value })} className="w-full p-1.5 border rounded">
                    <option value="5">5 - Orientado</option>
                    <option value="4">4 - Confuso</option>
                    <option value="3">3 - Inapropiado</option>
                    <option value="2">2 - Incomprensible</option>
                    <option value="1">1 - Ausente</option>
                  </select>
                </div>
                <div>
                  <label className="block text-gray-600 mb-0.5">Respuesta Motora</label>
                  <select value={glasgow.motora} onChange={(e) => setGlasgow({ ...glasgow, motora: e.target.value })} className="w-full p-1.5 border rounded">
                    <option value="6">6 - Obedece órdenes</option>
                    <option value="5">5 - Localiza el dolor</option>
                    <option value="4">4 - Retirada al dolor</option>
                    <option value="3">3 - Flexión anormal</option>
                    <option value="2">2 - Extensión anormal</option>
                    <option value="1">1 - Ausente</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Alertas dinámicas de signos vitales */}
            <div className="space-y-1 text-xs">
              {intTA && <div className={`p-2 rounded flex items-center space-x-2 ${intTA.alerta ? 'bg-[#FBF1E3] text-[#9A5B13]' : 'bg-emerald-50 text-emerald-800'}`}><AlertTriangle className="w-4 h-4" /><span>{intTA.texto}</span></div>}
              {intFC && <div className={`p-2 rounded flex items-center space-x-2 ${intFC.alerta ? 'bg-[#FBF1E3] text-[#9A5B13]' : 'bg-emerald-50 text-emerald-800'}`}><AlertTriangle className="w-4 h-4" /><span>{intFC.texto}</span></div>}
              {intFR && <div className={`p-2 rounded flex items-center space-x-2 ${intFR.alerta ? 'bg-[#FBF1E3] text-[#9A5B13]' : 'bg-emerald-50 text-emerald-800'}`}><AlertTriangle className="w-4 h-4" /><span>{intFR.texto}</span></div>}
            </div>
          </section>

          {/* Examen Físico Segmentario */}
          <section className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm">
            <h2 className="font-bold text-base text-[#1E3547] mb-4 flex items-center space-x-2 border-b border-gray-100 pb-2">
              <Stethoscope className="w-5 h-5 text-[#0B6E6E]" />
              <span>3. Examen Físico Segmentario</span>
            </h2>
            <div className="space-y-4 text-xs">
              {EXAMEN_SECCIONES.map((sec) => (
                <div key={sec.id} className="border border-gray-100 p-3 rounded-lg bg-gray-50/50">
                  <h3 className="font-bold text-gray-800 mb-2 flex items-center space-x-1.5">
                    <sec.icon className="w-4 h-4 text-[#0B6E6E]" />
                    <span>{sec.titulo}</span>
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {sec.campos.map((c) => (
                      <div key={c.key}>
                        <label className="block text-gray-600 mb-0.5">{c.label}</label>
                        {c.type === "select" ? (
                          <select value={examen[c.key]} onChange={(e) => setExamen({ ...examen, [c.key]: e.target.value })} className="w-full p-1.5 border border-[#DCE7E6] rounded bg-white">
                            {c.options.map((o) => (
                              <option key={o} value={o}>{o}</option>
                            ))}
                          </select>
                        ) : (
                          <input type="text" value={examen[c.key]} onChange={(e) => setExamen({ ...examen, [c.key]: e.target.value })} placeholder={c.placeholder} className="w-full p-1.5 border border-[#DCE7E6] rounded bg-white" />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Plan Farmacológico / Vademécum Integrado */}
          <section className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm">
            <h2 className="font-bold text-base text-[#1E3547] mb-4 flex items-center space-x-2 border-b border-gray-100 pb-2">
              <Pill className="w-5 h-5 text-[#0B6E6E]" />
              <span>4. Farmacoterapia e Indicaciones</span>
            </h2>
            <div className="text-xs space-y-3">
              <div className="flex space-x-2">
                <select value={selectedMed} onChange={(e) => setSelectedMed(e.target.value)} className="flex-1 p-2 border rounded-md">
                  <option value="">-- Seleccionar fármaco del Vademécum --</option>
                  {VADEMECUM.map((m) => (
                    <option key={m.id} value={m.id}>{m.nombre} ({m.comercial})</option>
                  ))}
                </select>
                <button type="button" onClick={addMed} className="bg-[#0B6E6E] text-white px-3 py-2 rounded-md font-semibold hover:bg-[#075252] flex items-center space-x-1">
                  <Plus className="w-4 h-4" />
                  <span>Agregar</span>
                </button>
              </div>

              {/* Fármacos agregados */}
              {meds.length > 0 && (
                <div className="space-y-2 mt-3">
                  {meds.map((m) => (
                    <div key={m.id} className="p-3 bg-teal-50/50 border border-teal-100 rounded-lg flex justify-between items-start">
                      <div>
                        <span className="font-bold text-[#0B6E6E]">{m.nombre}</span> <span className="text-gray-500">({m.comercial})</span>
                        <p className="text-gray-600 mt-0.5">Indicación: {m.indicacion}</p>
                        <p className="text-gray-500 italic text-[11px]">Cuidados: {m.cuidados}</p>
                      </div>
                      <button onClick={() => removeMed(m.id)} className="text-red-500 hover:text-red-700 p-1">
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              )}

              <div>
                <label className="block font-semibold text-gray-700 mb-1">Indicaciones u Observaciones Adicionales</label>
                <textarea rows={2} value={indicacionesExtra} onChange={(e) => setIndicacionesExtra(e.target.value)} placeholder="Otras indicaciones médicas o intervenciones de enfermería..." className="w-full p-2 border rounded-md outline-none focus:ring-1 focus:ring-[#0B6E6E]" />
              </div>
            </div>
          </section>

        </div>

        {/* Right Column: Narrative Document & Vademecum Lookup */}
        <div className="lg:col-span-5 space-y-6">
          
          {/* Narrativa Clínica Generada */}
          <div className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm sticky top-20">
            <div className="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
              <h2 className="font-bold text-base text-[#1E3547] flex items-center space-x-2">
                <FileText className="w-5 h-5 text-[#0B6E6E]" />
                <span>Informe Narrativo Clínico</span>
              </h2>
              <button onClick={handleCopy} className="flex items-center space-x-1 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded font-semibold transition-colors">
                {copied ? <Check className="w-3.5 h-3.5 text-green-600" /> : <Copy className="w-3.5 h-3.5" />}
                <span>{copied ? '¡Copiado!' : 'Copiar'}</span>
              </button>
            </div>

            <div className="bg-[#F8FAFA] p-4 rounded-lg border border-[#DCE7E6] text-xs font-serif leading-relaxed text-gray-800 whitespace-pre-wrap max-h-[350px] overflow-y-auto">
              {narrativa}
            </div>

            <button onClick={handleGuardarSupabase} disabled={loading} className="w-full mt-4 bg-[#0B6E6E] hover:bg-[#075252] text-white py-3 rounded-lg font-bold text-sm transition-colors shadow flex items-center justify-center space-x-2">
              <ClipboardList className="w-4 h-4" />
              <span>{loading ? 'Guardando en Supabase...' : 'Guardar Valoración en Base de Datos'}</span>
            </button>
          </div>

          {/* Vademécum de Consulta Rápida */}
          <div className="bg-white p-5 rounded-xl border border-[#DCE7E6] shadow-sm">
            <h2 className="font-bold text-base text-[#1E3547] mb-3 flex items-center space-x-2 border-b border-gray-100 pb-2">
              <BookOpen className="w-5 h-5 text-[#0B6E6E]" />
              <span>Vademécum de Consulta Rápida</span>
            </h2>
            <div className="relative mb-3">
              <Search className="w-4 h-4 absolute left-2.5 top-2.5 text-gray-400" />
              <input type="text" value={searchVademecum} onChange={(e) => setSearchVademecum(e.target.value)} placeholder="Buscar fármaco o familia..." className="w-full pl-8 pr-3 py-1.5 border rounded-md text-xs outline-none focus:ring-1 focus:ring-[#0B6E6E]" />
            </div>

            <div className="space-y-2 max-h-[280px] overflow-y-auto text-xs pr-1">
              {vademecumFiltrado.map((m) => (
                <div key={m.id} className="p-2.5 border rounded-lg bg-gray-50/50 hover:bg-gray-50">
                  <div className="font-bold text-[#1E3547]">{m.nombre} <span className="text-gray-500 font-normal">({m.comercial})</span></div>
                  <p className="text-[11px] text-[#0B6E6E] font-medium">{m.familia}</p>
                  <p className="text-gray-600 mt-1"><strong>Dosis:</strong> {m.dosis}</p>
                  {m.dosisPed && <p className="text-gray-600"><strong>Dosis Ped.:</strong> {m.dosisPed}</p>}
                  <p className="text-gray-500 text-[11px] mt-0.5"><strong>Dilución:</strong> {m.dilucion}</p>
                </div>
              ))}
            </div>
          </div>

        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
